<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>String to Integer</title>
    <link rel="stylesheet" href="../styles/friendlyFormat.css" />
  </head>
  <body>
    <fieldset>
      <legend>Source</legend>

      <div class="ff-field">
        <label for="sourceValue">Value to convert</label>
        <div class="ff-input-group">
          <input type="text" id="sourceValue" placeholder="%cartQuantity%" />
          <button type="button" id="sourceValueButton">Add data element</button>
        </div>
        <p class="ff-hint">
          Use a data element token such as <code>%cartQuantity%</code>, or type a
          literal value.
        </p>
        <p class="ff-error" id="sourceValueError">Provide a value to convert.</p>
      </div>
    </fieldset>

    <fieldset>
      <legend>Parsing</legend>

      <div class="ff-checkbox">
        <input type="checkbox" id="trimWhitespace" />
        <label for="trimWhitespace">Trim surrounding whitespace</label>
      </div>

      <div class="ff-checkbox">
        <input type="checkbox" id="stripNonNumeric" />
        <label for="stripNonNumeric">
          Strip non-numeric characters, so <code>$1,234</code> becomes
          <code>1234</code>
        </label>
      </div>

      <div class="ff-checkbox">
        <input type="checkbox" id="strictParsing" />
        <label for="strictParsing">
          Require the whole value to be numeric. When off, a leading number is
          used, so <code>12abc</code> becomes <code>12</code>.
        </label>
      </div>

      <div class="ff-field">
        <label for="decimalHandling">When the value has a decimal part</label>
        <select id="decimalHandling">
          <option value="round">Round to the nearest integer</option>
          <option value="truncate">Truncate toward zero</option>
          <option value="floor">Round down</option>
          <option value="ceil">Round up</option>
          <option value="invalid">Treat as an invalid value</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Edge cases</legend>

      <div id="defaultValueNote"></div>

      <div class="ff-field">
        <label for="invalidBehavior">
          When the value cannot be parsed as a number
        </label>
        <select id="invalidBehavior">
          <option value="default">Use the data element's default value</option>
          <option value="null">Return null</option>
          <option value="zero">Return 0</option>
        </select>
      </div>

      <div class="ff-field">
        <label for="emptyBehavior">
          When the value is empty or only whitespace
        </label>
        <select id="emptyBehavior">
          <option value="default">Use the data element's default value</option>
          <option value="null">Return null</option>
          <option value="zero">Return 0</option>
        </select>
      </div>

      <div class="ff-field">
        <label for="nullBehavior">When the value is null or undefined</label>
        <select id="nullBehavior">
          <option value="default">Use the data element's default value</option>
          <option value="null">Return null</option>
          <option value="zero">Return 0</option>
        </select>
      </div>
    </fieldset>

    <script src="https://assets.adobedtm.com/activation/reactor/extensionbridge/extensionbridge.min.js"></script>
    <script src="../scripts/friendlyFormat.js"></script>
    <script>
      (function () {
        'use strict';

        var ff = window.friendlyFormat;

        ff.renderDefaultValueNote('defaultValueNote');
        ff.wireDataElementButton('sourceValue', 'sourceValueButton');

        window.extensionBridge.register({
          init: function (info) {
            var settings = (info && info.settings) || {};

            ff.setValue('sourceValue', settings.sourceValue);
            ff.setChecked('trimWhitespace', settings.trimWhitespace, true);
            ff.setChecked('stripNonNumeric', settings.stripNonNumeric, false);
            ff.setChecked('strictParsing', settings.strictParsing, true);
            ff.setValue(
              'decimalHandling',
              settings.decimalHandling || 'round'
            );
            ff.setValue('invalidBehavior', settings.invalidBehavior || 'default');
            ff.setValue('emptyBehavior', settings.emptyBehavior || 'default');
            ff.setValue('nullBehavior', settings.nullBehavior || 'default');
          },

          getSettings: function () {
            return {
              sourceValue: ff.getValue('sourceValue').trim(),
              trimWhitespace: ff.isChecked('trimWhitespace'),
              stripNonNumeric: ff.isChecked('stripNonNumeric'),
              strictParsing: ff.isChecked('strictParsing'),
              decimalHandling: ff.getValue('decimalHandling'),
              invalidBehavior: ff.getValue('invalidBehavior'),
              emptyBehavior: ff.getValue('emptyBehavior'),
              nullBehavior: ff.getValue('nullBehavior')
            };
          },

          validate: function () {
            return ff.validateSourceValue();
          }
        });
      })();
    </script>
  </body>
</html>
